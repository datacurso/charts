{{- /*
Gateway API HTTPRoute (datacurso fork, 28.0.9). Opcional: httpRoute.enabled.
*/}}

{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs es obligatorio cuando httpRoute.enabled=true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if or .Values.httpRoute.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.httpRoute.annotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- include "common.tplvalues.render" ( dict "value" .Values.httpRoute.parentRefs "context" $ ) | nindent 4 }}
  hostnames:
    {{- if .Values.httpRoute.hostnames }}
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
    {{- else }}
    - {{ .Values.ingress.hostname | quote }}
    {{- range .Values.ingress.extraHosts }}
    - {{ .name | quote }}
    {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.path | quote }}
      backendRefs:
        - name: {{ include "common.names.fullname" . }}
          port: {{ .Values.service.ports.http }}
      {{- if .Values.httpRoute.timeouts }}
      timeouts: {{- include "common.tplvalues.render" ( dict "value" .Values.httpRoute.timeouts "context" $ ) | nindent 8 }}
      {{- end }}
    {{- if .Values.httpRoute.extraRules }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.httpRoute.extraRules "context" $ ) | nindent 4 }}
    {{- end }}
{{- end }}
